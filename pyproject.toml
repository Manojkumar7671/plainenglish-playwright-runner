[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plainenglish-playwright-runner"
version = "0.1.0"
description = "A guarded natural-language Playwright test runner with an OpenAI-compatible API"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.47,<2",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
plainenglish-runner = "plainenglish_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
